name: Fetch Google Drive Folder

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  download-and-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install gdown
        run: pip install gdown

      - name: Download from Google Drive
        run: |
          gdown --folder https://drive.google.com/drive/folders/1WmcV5sIqRxAwIVQx7vYNZlC8J4v-7l9I -O p4aids_notebooks

      - name: Unzip files inside p4aids_notebooks
        run: |
          # Find all zip files inside p4aids_notebooks
          find p4aids_notebooks -type f -name "*.zip" | while read z; do
            echo "Unzipping $z..."

            # Extract into the same directory as the zip file
            unzip -q "$z" -d "$(dirname "$z")"

            echo "Deleting $z to bypass GitHub's 100MB limit..."
            rm "$z"
          done

      - name: Commit and Push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

          git add p4aids_notebooks
          git commit -m "Auto-fetch and unzip assets from Google Drive" || echo "No changes to commit"

          git push
